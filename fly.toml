# Fly.io config (ADR-0021). Rooms live in memory, so run exactly ONE machine: deploy with `npm run deploy`.
app = "dronefight"
primary_region = "dfw"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleep when nobody is connected, wake on the next visit (~1 s). Open game connections keep it awake,
  # so it never stops mid-match; rooms that sleep away are empty anyway (ADR-0021, amended).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
