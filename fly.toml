# Fly.io config (ADR-0021). Rooms live in memory, so run exactly ONE machine: deploy with `npm run deploy`.
app = "dronefight"
primary_region = "dfw"

[build]
  # Optional sign-in (ADR-0031). Both values are public (the anon key is meant for browsers; row-level
  # security protects the data). Empty = sign-in hidden. See RUNBOOK "Sign-in (Supabase)".
  [build.args]
    VITE_SUPABASE_URL = "https://xganabqltqpltzgidejq.supabase.co"
    VITE_SUPABASE_ANON_KEY = "sb_publishable_DDG5ebpRxRm7sxtJCmsj0w_53Oy255N"

[env]
  # XP (ADR-0032): the server writes progress with SUPABASE_SECRET_KEY, set with `fly secrets set` (never here).
  SUPABASE_URL = "https://xganabqltqpltzgidejq.supabase.co"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleep when nobody is connected, wake on the next visit (~1 s). Open game connections keep it awake,
  # so it never stops mid-match; rooms that sleep away are empty anyway (ADR-0021, amended).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
