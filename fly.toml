# Fly.io config (ADR-0021). Rooms live in memory, so run exactly ONE machine: deploy with `npm run deploy`.
app = "dronefight"
primary_region = "dfw"

[build]
  # Optional sign-in (ADR-0031). Both values are public (the anon key is meant for browsers; row-level
  # security protects the data). Empty = sign-in hidden. See RUNBOOK "Sign-in (Supabase)".
  [build.args]
    VITE_SUPABASE_URL = ""
    VITE_SUPABASE_ANON_KEY = ""

[http_service]
  internal_port = 8080
  force_https = true
  # Never sleep: a cold start would drop players mid-match.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
